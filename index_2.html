<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>Dynasty Hall of Fame</title>
<style>
:root{--bg:#080b12;--card:#111827;--card2:#0b1220;--text:#f8fafc;--muted:#94a3b8;--gold:#f6c744;--line:#263248;--green:#86efac;--qb:#14c9a3;--rb:#149ed1;--wr:#f52c68;--te:#d326e8;--pk:#f6a914}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b1020,#080b12 32%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 16px 80px}.eyebrow{color:var(--gold);font-weight:900;letter-spacing:.16em;font-size:12px}.hero h1{font-size:38px;line-height:1;margin:9px 0}.hero p,.meta,.fine,.status{color:var(--muted)}.panel,.card{background:#111827ee;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 14px 40px #0004}.status{font-size:14px}.good{color:var(--green)}.error{color:#fca5a5}.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0;position:sticky;top:0;background:#080b12ee;backdrop-filter:blur(10px);z-index:5}.tab{white-space:nowrap;border-radius:12px;border:1px solid var(--line);padding:10px 13px;font-weight:850;background:#111827;color:#cbd5e1}.tab.active{background:var(--gold);color:#17120a}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card2);border:1px solid #233047;border-radius:14px;padding:13px}.stat b{display:block;font-size:21px}.stat span,.fine{font-size:12px}.champ{border-left:4px solid var(--gold)}.year{font-size:13px;color:var(--gold);font-weight:900}.champ h3,.team h3{font-size:24px;margin:5px 0}.owner{font-size:13px;color:#cbd5e1;margin-top:3px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid #243047;vertical-align:top}th{color:#94a3b8;font-size:12px}.right{text-align:right}.share{width:100%;margin-top:12px;border:1px solid #334155;border-radius:12px;padding:12px;background:#1f2937;color:#fff;font-weight:800}.power-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.rank{font-size:30px;font-weight:900;color:var(--gold);min-width:42px}.score{font-size:22px;font-weight:900;text-align:right}.archetype{font-size:13px;font-weight:800;margin-top:4px;color:#cbd5e1}.bar{display:flex;height:22px;border-radius:7px;overflow:hidden;background:#05080e;margin:12px 0 8px;border:1px solid #1d2738}.seg{display:flex;align-items:center;justify-content:center;color:#071018;font-size:11px;font-weight:900;min-width:2px}.qb{background:var(--qb)}.rb{background:var(--rb)}.wr{background:var(--wr)}.te{background:var(--te)}.pk{background:var(--pk)}.legend{display:flex;gap:11px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.metric{background:#0b1220;border-radius:10px;padding:9px 6px;text-align:center}.metric b{display:block;font-size:15px}.metric span{font-size:10px;color:var(--muted)}details{margin:12px 0}summary{cursor:pointer;font-weight:850;color:var(--gold)}.formula{line-height:1.5}.playerrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.playername{font-weight:800}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#202b3e;font-size:11px;color:#cbd5e1;margin-right:5px}.value{font-weight:900}.up{color:#86efac}.down{color:#fca5a5}.credit{text-align:center;margin:24px 0;font-size:11px;color:#64748b}.credit a{color:#94a3b8}.rosterlist{margin-top:12px;border-top:1px solid #243047}.rosterline{display:grid;grid-template-columns:42px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #202b3e;font-size:13px}.pos{font-weight:900}.section-title{margin:4px 0 8px}.alias{font-size:12px;color:#64748b}.warn{color:#fbbf24}.nowrap{white-space:nowrap}@media(max-width:520px){.hero h1{font-size:35px}.metrics{grid-template-columns:1fr 1fr}.wrap{padding-left:14px;padding-right:14px}table{font-size:13px}}
</style></head><body><main class="wrap">
<section class="hero"><div class="eyebrow">SLEEPER DYNASTY</div><h1>Hall of Fame</h1><p>The encyclopedia of your league — history, players, franchises and the market today.</p></section>
<section class="panel"><div id="status" class="status">Connecting to Sleeper…</div></section>
<div id="app" class="hidden"><nav class="tabs"><button class="tab active" data-tab="power">Power</button><button class="tab" data-tab="champions">Champions</button><button class="tab" data-tab="records">Records</button><button class="tab" data-tab="franchises">Franchises</button><button class="tab" data-tab="players">Players</button><button class="tab" data-tab="seasons">Seasons</button></nav>
<section id="power"></section><section id="champions" class="hidden"></section><section id="records" class="hidden"></section><section id="franchises" class="hidden"></section><section id="players" class="hidden"></section><section id="seasons" class="hidden"></section></div>
<div class="credit">Dynasty market data from <a href="https://statsguyfantasy.com" target="_blank" rel="noopener">Stats Guy Fantasy</a>. League data from Sleeper.</div>
</main><script>
const START_LEAGUE_ID='1311827730211282944', SLEEPER='https://api.sleeper.app/v1', SGF='https://api.statsguyfantasy.com/api/v1', FORMAT='sf_dynasty';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function get(url){const r=await fetch(url);if(!r.ok)throw new Error(`${r.status} ${url}`);return r.json()}
function fp(s,k='fpts'){return Number(s?.[k]||0)+Number(s?.[k+'_decimal']||0)/100}
function teamName(u){return u?.metadata?.team_name||u?.display_name||u?.username||'Unknown Franchise'}
function username(u){return u?.username||u?.display_name||'Unknown owner'}
async function lineage(id){let out=[],seen=new Set();while(id&&id!=='0'&&!seen.has(id)){seen.add(id);let l=await get(`${SLEEPER}/league/${id}`);out.push(l);id=l.previous_league_id}return out.sort((a,b)=>+a.season-+b.season)}
async function seasonData(l){const [users,rosters,bracket]=await Promise.all([get(`${SLEEPER}/league/${l.league_id}/users`),get(`${SLEEPER}/league/${l.league_id}/rosters`),get(`${SLEEPER}/league/${l.league_id}/winners_bracket`).catch(()=>[])]);const maxWeek=18;let ms=await Promise.all(Array.from({length:maxWeek},(_,i)=>get(`${SLEEPER}/league/${l.league_id}/matchups/${i+1}`).catch(()=>[])));let weeks=ms.map((m,i)=>({week:i+1,matchups:m})).filter(x=>x.matchups?.length);const um=Object.fromEntries(users.map(u=>[u.user_id,u])),rm=Object.fromEntries(rosters.map(r=>[r.roster_id,r]));let cm=[...bracket].filter(x=>x.p===1&&x.w).sort((a,b)=>b.r-a.r)[0];return{league:l,users,rosters,weeks,bracket,um,rm,champ:cm?rm[cm.w]:null,runner:cm?rm[cm.l]:null}}
function percentile(v,arr){if(!arr.length)return 0;let s=[...arr].sort((a,b)=>a-b);if(s.length===1)return 100;let below=s.filter(x=>x<v).length,equal=s.filter(x=>x===v).length;return Math.round(100*(below+(equal-1)/2)/(s.length-1))}
function aliasesFor(owner,seasons){let a=[];for(const s of seasons){let r=s.rosters.find(x=>x.owner_id===owner);if(r){let n=teamName(s.um[owner]);if(n&&!a.includes(n))a.push(n)}}return a}
function historical(seasons){let games=[],fr={},playerPts={};for(const s of seasons){for(const r of s.rosters){let u=s.um[r.owner_id],key=r.owner_id||`r-${r.roster_id}`,f=fr[key]??={key,name:teamName(u),user:username(u),wins:0,losses:0,pf:0,titles:0,seasons:0};f.name=teamName(u);f.user=username(u);f.wins+=r.settings?.wins||0;f.losses+=r.settings?.losses||0;f.pf+=fp(r.settings);f.seasons++;if(s.champ?.roster_id===r.roster_id)f.titles++}for(const wk of s.weeks){let groups={};wk.matchups.forEach(m=>{(groups[m.matchup_id]??=[]).push(m);if(m.players_points)for(const [pid,pts] of Object.entries(m.players_points)){let k=`${s.league.season}:${pid}`,p=playerPts[k]??={season:s.league.season,pid,pts:0,best:0,bestWeek:0};p.pts+=Number(pts||0);if(Number(pts||0)>p.best){p.best=Number(pts);p.bestWeek=wk.week}}});Object.values(groups).forEach(g=>{if(g.length===2&&(+g[0].points||+g[1].points))games.push({season:s.league.season,week:wk.week,a:g[0],b:g[1],sa:+g[0].points||0,sb:+g[1].points||0,s})})}}return{games,fr:Object.values(fr),playerPts:Object.values(playerPts)}}
async function marketData(){const [p,picks]=await Promise.all([get(`${SGF}/players`),get(`${SGF}/picks`).catch(()=>({picks:[]}))]);return{players:p.players||[],valuesAsOf:p.valuesAsOf||{},picks:picks.picks||[]}}
function mv(p){return Number(p?.value?.[FORMAT]||0)}
function archetype(x){if(x.start>=80&&x.assets>=75)return'Juggernaut';if(x.start>=68&&x.performance>=55)return'Strong Contender';if(x.assets>=62&&x.start>=55)return'Contender';if(x.future>=75&&x.start<50)return'Loaded Rebuilder';if(x.start<35&&x.assets<45)return'Deep Rebuild';if(x.future>=60&&x.start<55)return'Rebuilder';if(Math.abs(x.start-x.future)>=45)return x.start>x.future?'Win-Now / Top Heavy':'Future Heavy';return'Balanced'}
function pickOwnership(cur,traded,years){let out=[];for(const y of years)for(let round=1;round<=4;round++)for(const r of cur.rosters)out.push({season:String(y),round,original:r.roster_id,owner:r.roster_id});for(const t of traded||[]){let x=out.find(p=>p.season==t.season&&p.round==t.round&&p.original==t.roster_id);if(x)x.owner=t.owner_id}return out}
function pickVal(pick,market){let matches=market.picks.filter(x=>String(x.year)===String(pick.season)&&+x.round===+pick.round);let generic=matches.find(x=>x.variant==='mid')||matches.find(x=>x.variant==null&&x.slot==null)||matches[0];return Number(generic?.value?.[FORMAT]||0)}
async function powerData(cur,market){let traded=await get(`${SLEEPER}/league/${cur.league.league_id}/traded_picks`).catch(()=>[]), year=+cur.league.season, years=[year+1,year+2,year+3], ownership=pickOwnership(cur,traded,years), pmap=Object.fromEntries(market.players.map(p=>[String(p.id),p]));let rows=cur.rosters.map(r=>{let vals=(r.players||[]).map(id=>pmap[String(id)]).filter(Boolean), starters=(r.starters||[]).map(id=>pmap[String(id)]).filter(Boolean);let playerValue=vals.reduce((a,p)=>a+mv(p),0), starterValue=starters.reduce((a,p)=>a+mv(p),0);let picks=ownership.filter(p=>p.owner===r.roster_id),pickValue=picks.reduce((a,p)=>a+pickVal(p,market),0);let pos={QB:0,RB:0,WR:0,TE:0,PK:pickValue};for(const p of vals){if(pos[p.position]!=null)pos[p.position]+=mv(p)}return{r,u:cur.um[r.owner_id],vals,starters,playerValue,pickValue,total:playerValue+pickValue,starterValue,picks,pos,wins:r.settings?.wins||0,losses:r.settings?.losses||0,pf:fp(r.settings)}});let totals=rows.map(x=>x.total),starts=rows.map(x=>x.starterValue),perfs=rows.map(x=>x.pf),futures=rows.map(x=>x.pickValue);for(const x of rows){x.assets=percentile(x.total,totals);x.start=percentile(x.starterValue,starts);x.performance=percentile(x.pf,perfs);x.future=percentile(x.pickValue,futures);x.score=Math.round(x.assets*.50+x.start*.30+x.performance*.10+x.future*.10);x.arch=archetype(x)}return rows.sort((a,b)=>b.score-a.score||b.total-a.total)}
function renderPower(rows,market){let asof=market.valuesAsOf?.[FORMAT];$('#power').innerHTML=`<article class="card"><h2 class="section-title">Current Power Rankings</h2><div class="meta">Superflex dynasty roster market values${asof?` • values ${esc(asof.slice(0,10))}`:''}</div><details><summary>How the Power Score works</summary><div class="fine formula"><b>50% Dynasty Assets</b> — percentile of total current player + future pick market value.<br><b>30% Starting Strength</b> — percentile of market value concentrated in the current starting lineup.<br><b>10% Current Performance</b> — percentile of current-season points for (PF).<br><b>10% Future Capital</b> — percentile of owned future rookie-pick value.<br><br>Each component is scored relative to this league, then weighted into a 0–100 score. Archetypes are rule-based descriptions of roster shape, not an additional scoring input. Market values come from Stats Guy Fantasy and are derived from real dynasty trades. The formula is intentionally published so the ranking is auditable.</div></details><div class="legend"><span><i class="dot qb"></i>QB</span><span><i class="dot rb"></i>RB</span><span><i class="dot wr"></i>WR</span><span><i class="dot te"></i>TE</span><span><i class="dot pk"></i>Picks</span></div></article>`+rows.map((x,i)=>{let sum=Object.values(x.pos).reduce((a,b)=>a+b,0)||1;let bars=['QB','RB','WR','TE','PK'].map(k=>`<div class="seg ${k.toLowerCase()}" style="width:${100*x.pos[k]/sum}%">${x.pos[k]?Math.round(100*x.pos[k]/sum):''}</div>`).join('');let top=x.vals.sort((a,b)=>mv(b)-mv(a)).slice(0,5).map(p=>`<div class="rosterline"><span class="pos">${esc(p.position)}</span><span>${esc(p.name)}</span><b>${mv(p).toLocaleString()}</b></div>`).join('');return `<article class="card team"><div class="power-head"><div style="display:flex;gap:10px"><div class="rank">${i+1}</div><div><h3>${esc(teamName(x.u))}</h3><div class="owner">@${esc(username(x.u))} • ${x.wins}-${x.losses} • ${x.pf.toFixed(2)} PF</div><div class="archetype">${esc(x.arch)}</div></div></div><div><div class="score">${x.score}</div><div class="fine">POWER</div></div></div><div class="bar">${bars}</div><div class="metrics"><div class="metric"><b>${x.assets}</b><span>ASSETS 50%</span></div><div class="metric"><b>${x.start}</b><span>STARTERS 30%</span></div><div class="metric"><b>${x.performance}</b><span>PERFORMANCE 10%</span></div><div class="metric"><b>${x.future}</b><span>FUTURE 10%</span></div></div><details><summary>Top assets • ${x.total.toLocaleString()} total value</summary><div class="rosterlist">${top}</div><div class="fine">Players ${x.playerValue.toLocaleString()} • Picks ${x.pickValue.toLocaleString()}</div></details></article>`}).join('')}
function renderAll(seasons,market,power){const h=historical(seasons),completed=seasons.filter(s=>s.champ),cur=seasons.at(-1),pmap=Object.fromEntries(market.players.map(p=>[String(p.id),p]));renderPower(power,market);
$('#champions').innerHTML=`<div class="grid"><div class="stat"><b>${completed.length}</b><span>champions crowned</span></div><div class="stat"><b>${seasons[0].league.season}–${cur.league.season}</b><span>league history</span></div></div>`+completed.slice().reverse().map(s=>{let u=s.um[s.champ.owner_id],ru=s.runner?s.um[s.runner.owner_id]:null;return `<article class="card champ"><div class="year">${esc(s.league.season)} CHAMPION</div><h3>${esc(teamName(u))}</h3><div class="owner">Owner: @${esc(username(u))}</div><div class="meta">${s.champ?.settings?.wins??'—'}–${s.champ?.settings?.losses??'—'} • ${fp(s.champ?.settings).toFixed(2)} PF${ru?` • defeated ${esc(teamName(ru))} (@${esc(username(ru))})`:''}</div><button class="share" onclick="shareSeason('${s.league.season}')">Share champion</button></article>`}).join('');
let hi=h.games.slice().sort((x,y)=>Math.max(y.sa,y.sb)-Math.max(x.sa,x.sb))[0],blow=h.games.slice().sort((x,y)=>Math.abs(y.sa-y.sb)-Math.abs(x.sa-x.sb))[0],close=h.games.filter(g=>g.sa!==g.sb).sort((x,y)=>Math.abs(x.sa-x.sb)-Math.abs(y.sa-y.sb))[0];function gd(g){if(!g)return'—';let w=g.sa>=g.sb?g.a:g.b,owner=g.s.rm[w.roster_id]?.owner_id,u=g.s.um[owner];return `${teamName(u)} (@${username(u)}) ${Math.max(g.sa,g.sb).toFixed(2)}–${Math.min(g.sa,g.sb).toFixed(2)} (${g.season} W${g.week})`}
$('#records').innerHTML=`<article class="card"><h2>Record Book</h2><table><tr><th>Record</th><th>Holder</th></tr><tr><td>Highest team game</td><td>${esc(gd(hi))}</td></tr><tr><td>Biggest blowout</td><td>${esc(gd(blow))}</td></tr><tr><td>Closest decided game</td><td>${esc(gd(close))}</td></tr></table></article>`;
h.fr.sort((a,b)=>b.titles-a.titles||b.wins-a.wins||b.pf-a.pf);$('#franchises').innerHTML=`<article class="card"><h2>Franchise Hall</h2><div class="fine">Franchises are tied to the persistent Sleeper owner, so team-name changes stay with the same franchise.</div><table><tr><th>Franchise / owner</th><th class="right">🏆</th><th class="right">W</th><th class="right">PF</th></tr>${h.fr.map(f=>`<tr><td><b>${esc(f.name)}</b><div class="owner">@${esc(f.user)}</div><div class="alias">Aliases: ${esc(aliasesFor(f.key,seasons).join(' → '))}</div></td><td class="right">${f.titles}</td><td class="right">${f.wins}</td><td class="right">${f.pf.toFixed(1)}</td></tr>`).join('')}</table></article>`;
let career={};for(const x of h.playerPts){let p=career[x.pid]??={pid:x.pid,pts:0,best:0,bestSeason:null,bestGame:0,bestWeek:null,seasons:0};p.pts+=x.pts;p.seasons++;if(x.pts>p.best){p.best=x.pts;p.bestSeason=x.season}if(x.best>p.bestGame){p.bestGame=x.best;p.bestWeek=`${x.season} W${x.bestWeek}`}}let leaders=Object.values(career).filter(x=>pmap[x.pid]).sort((a,b)=>b.pts-a.pts).slice(0,75);$('#players').innerHTML=`<article class="card"><h2>Player Encyclopedia</h2><div class="meta">Historical points scored while rostered in this league + current dynasty market data.</div><table><tr><th>Player</th><th class="right">League Pts</th><th class="right">Dynasty</th></tr>${leaders.map((x,i)=>{let p=pmap[x.pid],chg=p?.valueChange?.[FORMAT]?.days30||0;return `<tr><td><b>${i+1}. ${esc(p.name)}</b><div class="fine">${esc(p.position)} • ${esc(p.team||'FA')} • age ${p.age??'—'} • best season ${x.bestSeason}: ${x.best.toFixed(1)} • best game ${x.bestGame.toFixed(1)} (${x.bestWeek})</div></td><td class="right">${x.pts.toFixed(1)}</td><td class="right"><b>${mv(p).toLocaleString()}</b><div class="fine ${chg>=0?'up':'down'}">30d ${chg>=0?'+':''}${chg}</div></td></tr>`}).join('')}</table><div class="fine">Historical totals use Sleeper matchup player scoring, so they reflect this league's scoring and players who appeared on league rosters. They are not NFL-wide PPR totals.</div></article>`;
$('#seasons').innerHTML=seasons.slice().reverse().map(s=>`<article class="card"><h2>${esc(s.league.season)}</h2><div class="meta">${esc(s.league.name)} • ${s.rosters.length} teams • ${esc(s.league.status)}</div><div class="fine">League ID ${esc(s.league.league_id)}</div></article>`).join('');window.__seasons=seasons;$('#app').classList.remove('hidden')}
async function build(){try{$('#status').textContent='Finding every season in the Sleeper league chain…';let ls=await lineage(START_LEAGUE_ID);let ss=[];for(let i=0;i<ls.length;i++){$('#status').textContent=`Importing ${ls[i].season} (${i+1}/${ls.length})…`;ss.push(await seasonData(ls[i]))}$('#status').textContent='Loading dynasty market values…';let market=await marketData();$('#status').textContent='Valuing current rosters and future picks…';let power=await powerData(ss.at(-1),market);renderAll(ss,market,power);$('#status').innerHTML=`<span class="good">Done.</span> ${ss.length} seasons • ${market.players.length} dynasty-valued players • power rankings live.`}catch(e){console.error(e);$('#status').innerHTML=`<span class="error">Load failed:</span> ${esc(e.message)}. Refresh once; if it repeats, send a screenshot of this exact message.`}}
async function shareSeason(year){let s=window.__seasons.find(x=>x.league.season==year),u=s?.champ?s.um[s.champ.owner_id]:null,text=`🏆 ${year} DYNASTY CHAMPION\n${teamName(u)} — @${username(u)}\n${s.champ?.settings?.wins??'—'}–${s.champ?.settings?.losses??'—'} • ${fp(s.champ?.settings).toFixed(2)} PF`;if(navigator.share)await navigator.share({title:`${year} Dynasty Champion`,text,url:location.href});else{await navigator.clipboard.writeText(text+'\n'+location.href);alert('Copied!')}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['power','champions','records','franchises','players','seasons'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==b.dataset.tab))});build();
</script></body></html>
