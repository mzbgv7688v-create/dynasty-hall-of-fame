<section class="hero"><div class="eyebrow">SLEEPER DYNASTY</div><h1>Hall of Fame</h1><p>League history, player production, franchise records and current dynasty market analysis.</p></section>

</main><script>
const START_LEAGUE_ID='1311827730211282944', SLEEPER='https://api.sleeper.app/v1', SGF='https://api.statsguyfantasy.com/api/v1', FORMAT='sf_dynasty';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function get(url){const r=await fetch(url);if(!r.ok)throw new Error(`${r.status} ${url}`);return r.json()}
function fp(s,k='fpts'){return Number(s?.[k]||0)+Number(s?.[k+'_decimal']||0)/100}
function teamName(u){return u?.metadata?.team_name||u?.display_name||u?.username||'Unknown Franchise'}
function username(u){return u?.username||u?.display_name||'Unknown owner'}
async function lineage(id){let out=[],seen=new Set();while(id&&id!=='0'&&!seen.has(id)){seen.add(id);let l=await get(`${SLEEPER}/league/${id}`);out.push(l);id=l.previous_league_id}return out.sort((a,b)=>+a.season-+b.season)}
async function seasonData(l){const [users,rosters,bracket]=await Promise.all([get(`${SLEEPER}/league/${l.league_id}/users`),get(`${SLEEPER}/league/${l.league_id}/rosters`),get(`${SLEEPER}/league/${l.league_id}/winners_bracket`).catch(()=>[])]);const maxWeek=18;let ms=await Promise.all(Array.from({length:maxWeek},(_,i)=>get(`${SLEEPER}/league/${l.league_id}/matchups/${i+1}`).catch(()=>[])));let weeks=ms.map((m,i)=>({week:i+1,matchups:m})).filter(x=>x.matchups?.length);const um=Object.fromEntries(users.map(u=>[u.user_id,u])),rm=Object.fromEntries(rosters.map(r=>[r.roster_id,r]));let cm=[...bracket].filter(x=>x.p===1&&x.w).sort((a,b)=>b.r-a.r)[0];return{league:l,users,rosters,weeks,bracket,um,rm,champ:cm?rm[cm.w]:null,runner:cm?rm[cm.l]:null}}
function percentile(v,arr){if(!arr.length)return 0;let s=[...arr].sort((a,b)=>a-b);if(s.length===1)return 100;let below=s.filter(x=>x<v).length,equal=s.filter(x=>x===v).length;return Math.round(100*(below+(equal-1)/2)/(s.length-1))}
function aliasesFor(owner,seasons){let a=[];for(const s of seasons){let r=s.rosters.find(x=>x.owner_id===owner);if(r){let n=teamName(s.um[owner]);if(n&&!a.includes(n))a.push(n)}}return a}
function historical(seasons){let games=[],fr={},playerPts={},managerPlayer={};for(const s of seasons){for(const r of s.rosters){let u=s.um[r.owner_id],key=r.owner_id||`r-${r.roster_id}`,f=fr[key]??={key,name:teamName(u),user:username(u),wins:0,losses:0,pf:0,titles:0,seasons:0};f.name=teamName(u);f.user=username(u);f.wins+=r.settings?.wins||0;f.losses+=r.settings?.losses||0;f.pf+=fp(r.settings);f.seasons++;if(s.champ?.roster_id===r.roster_id)f.titles++}for(const wk of s.weeks){let groups={};wk.matchups.forEach(m=>{(groups[m.matchup_id]??=[]).push(m);if(m.players_points){let owner=s.rm[m.roster_id]?.owner_id,u=s.um[owner],mgr=owner||`r-${m.roster_id}`;for(const [pid,pts0] of Object.entries(m.players_points)){let pts=Number(pts0||0),k=`${s.league.season}:${pid}`,p=playerPts[k]??={season:s.league.season,pid,pts:0,best:-999,bestWeek:0};p.pts+=pts;if(pts>p.best){p.best=pts;p.bestWeek=wk.week}let mk=`${pid}:${mgr}`,mp=managerPlayer[mk]??={pid,mgr,user:username(u),team:teamName(u),pts:0,seasons:new Set()};mp.pts+=pts;mp.seasons.add(String(s.league.season))}}});Object.values(groups).forEach(g=>{if(g.length===2&&(+g[0].points||+g[1].points))games.push({season:s.league.season,week:wk.week,a:g[0],b:g[1],sa:+g[0].points||0,sb:+g[1].points||0,s})})}}return{games,fr:Object.values(fr),playerPts:Object.values(playerPts),managerPlayer:Object.values(managerPlayer).map(x=>({...x,seasons:[...x.seasons]}))}}
async function marketData(){const [p,picks]=await Promise.all([get(`${SGF}/players`),get(`${SGF}/picks`).catch(()=>({picks:[]}))]);return{players:p.players||[],valuesAsOf:p.valuesAsOf||{},picks:picks.picks||[]}}
function mv(p){return Number(p?.value?.[FORMAT]||0)}
function archetype(x){if(x.start>=80&&x.assets>=75)return'Juggernaut';if(x.start>=68&&x.performance>=55)return'Strong Contender';if(x.assets>=62&&x.start>=55)return'Contender';if(x.future>=75&&x.start<50)return'Loaded Rebuilder';if(x.start<35&&x.assets<45)return'Deep Rebuild';if(x.future>=60&&x.start<55)return'Rebuilder';if(Math.abs(x.start-x.future)>=45)return x.start>x.future?'Win-Now / Top Heavy':'Future Heavy';return'Balanced'}
function pickOwnership(cur,traded,years){let out=[];for(const y of years)for(let round=1;round<=4;round++)for(const r of cur.rosters)out.push({season:String(y),round,original:r.roster_id,owner:r.roster_id});for(const t of traded||[]){let x=out.find(p=>p.season==t.season&&p.round==t.round&&p.original==t.roster_id);if(x)x.owner=t.owner_id}return out}
function pickVal(pick,market){let matches=market.picks.filter(x=>String(x.year)===String(pick.season)&&+x.round===+pick.round);let generic=matches.find(x=>x.variant==='mid')||matches.find(x=>x.variant==null&&x.slot==null)||matches[0];return Number(generic?.value?.[FORMAT]||0)}
function scaledScore(v,arr){let mean=arr.reduce((a,b)=>a+b,0)/(arr.length||1),variance=arr.reduce((a,b)=>a+(b-mean)**2,0)/(arr.length||1),sd=Math.sqrt(variance)||1,z=(v-mean)/sd;return Math.round(Math.max(20,Math.min(99,70+z*12)))}
async function powerData(cur,market){let traded=await get(`${SLEEPER}/league/${cur.league.league_id}/traded_picks`).catch(()=>[]), year=+cur.league.season, years=[year+1,year+2,year+3], ownership=pickOwnership(cur,traded,years), pmap=Object.fromEntries(market.players.map(p=>[String(p.id),p]));let rows=cur.rosters.map(r=>{let vals=(r.players||[]).map(id=>pmap[String(id)]).filter(Boolean), starters=(r.starters||[]).map(id=>pmap[String(id)]).filter(Boolean);let playerValue=vals.reduce((a,p)=>a+mv(p),0), starterValue=starters.reduce((a,p)=>a+mv(p),0);let picks=ownership.filter(p=>p.owner===r.roster_id),pickValue=picks.reduce((a,p)=>a+pickVal(p,market),0);let pos={QB:0,RB:0,WR:0,TE:0,PK:pickValue},startPos={QB:0,RB:0,WR:0,TE:0};for(const p of vals){if(pos[p.position]!=null)pos[p.position]+=mv(p)}for(const p of starters){if(startPos[p.position]!=null)startPos[p.position]+=mv(p)}return{r,u:cur.um[r.owner_id],vals,starters,playerValue,pickValue,total:playerValue+pickValue,starterValue,picks,pos,startPos,wins:r.settings?.wins||0,losses:r.settings?.losses||0,pf:fp(r.settings)}});let totals=rows.map(x=>x.total),starts=rows.map(x=>x.starterValue),perfs=rows.map(x=>x.pf),futures=rows.map(x=>x.pickValue);for(const x of rows){x.assets=scaledScore(x.total,totals);x.start=scaledScore(x.starterValue,starts);x.performance=scaledScore(x.pf,perfs);x.future=scaledScore(x.pickValue,futures);x.score=Math.round(x.assets*.50+x.start*.30+x.performance*.10+x.future*.10);x.arch=archetype(x)}return rows.sort((a,b)=>b.score-a.score||b.total-a.total)}
function renderPower(rows,market){let asof=market.valuesAsOf?.[FORMAT];$('#power').innerHTML=`<article class="card"><h2 class="section-title">Current Power Rankings</h2><div class="meta">Superflex dynasty roster market values${asof?` • values ${esc(asof.slice(0,10))}`:''}</div><details><summary>How the Power Score works</summary><div class="fine formula"><b>50% Dynasty Assets</b>: total current player and future pick market value.<br><b>30% Starting Strength</b>: market value concentrated in the current starting lineup.<br><b>10% Current Performance</b>: current-season points for.<br><b>10% Future Capital</b>: value of owned future rookie picks.<br><br>Component scores are normalized against this league using a compressed 20 to 99 scale centered near 70. This preserves meaningful separation without forcing the best and worst teams toward 100 and 0. Archetypes describe roster construction and do not change the Power Score.</div></details><div class="legend"><span><i class="dot qb"></i>QB</span><span><i class="dot rb"></i>RB</span><span><i class="dot wr"></i>WR</span><span><i class="dot te"></i>TE</span><span><i class="dot pk"></i>Picks</span></div></article>`+rows.map((x,i)=>{let sum=Object.values(x.pos).reduce((a,b)=>a+b,0)||1;let bars=['QB','RB','WR','TE','PK'].map(k=>`<div class="seg ${k.toLowerCase()}" style="width:${100*x.pos[k]/sum}%">${x.pos[k]?Math.round(100*x.pos[k]/sum):''}</div>`).join('');let top=x.vals.sort((a,b)=>mv(b)-mv(a)).slice(0,5).map(p=>`<div class="rosterline"><span class="pos">${esc(p.position)}</span><span>${esc(p.name)}</span><b>${mv(p).toLocaleString()}</b></div>`).join('');return `<article class="card team"><div class="power-head"><div style="display:flex;gap:10px"><div class="rank">${i+1}</div><div><h3>${esc(teamName(x.u))}</h3><div class="owner">@${esc(username(x.u))} • ${x.wins}-${x.losses} • ${x.pf.toFixed(2)} PF</div><div class="archetype">${esc(x.arch)}</div></div></div><div><div class="score">${x.score}</div><div class="fine">POWER</div></div></div><div class="bar">${bars}</div><div class="metrics"><div class="metric"><b>${x.assets}</b><span>ASSETS 50%</span></div><div class="metric"><b>${x.start}</b><span>STARTERS 30%</span></div><div class="metric"><b>${x.performance}</b><span>PERFORMANCE 10%</span></div><div class="metric"><b>${x.future}</b><span>FUTURE 10%</span></div></div><details><summary>Top assets • ${x.total.toLocaleString()} total value</summary><div class="rosterlist">${top}</div><div class="fine">Players ${x.playerValue.toLocaleString()} • Picks ${x.pickValue.toLocaleString()}</div></details></article>`}).join('')}
function renderAll(seasons,market,power){const h=historical(seasons),completed=seasons.filter(s=>s.champ),cur=seasons.at(-1),pmap=Object.fromEntries(market.players.map(p=>[String(p.id),p]));renderPower(power,market);
$('#champions').innerHTML=`<div class="grid"><div class="stat"><b>${completed.length}</b><span>champions crowned</span></div><div class="stat"><b>${seasons[0].league.season}–${cur.league.season}</b><span>league history</span></div></div>`+completed.slice().reverse().map(s=>{let u=s.um[s.champ.owner_id],ru=s.runner?s.um[s.runner.owner_id]:null;return `<article class="card champ"><div class="year">${esc(s.league.season)} CHAMPION</div><h3>${esc(teamName(u))}</h3><div class="owner">Owner: @${esc(username(u))}</div><div class="meta">${s.champ?.settings?.wins??'—'}–${s.champ?.settings?.losses??'—'} • ${fp(s.champ?.settings).toFixed(2)} PF${ru?` • defeated ${esc(teamName(ru))} (@${esc(username(ru))})`:''}</div><button class="share" onclick="shareSeason('${s.league.season}')">Share champion</button></article>`}).join('');
let hi=h.games.slice().sort((x,y)=>Math.max(y.sa,y.sb)-Math.max(x.sa,x.sb))[0],
blow=h.games.slice().sort((x,y)=>Math.abs(y.sa-y.sb)-Math.abs(x.sa-x.sb))[0],
close=h.games.filter(g=>g.sa!==g.sb).sort((x,y)=>Math.abs(x.sa-x.sb)-Math.abs(y.sa-y.sb))[0],
combined=h.games.slice().sort((x,y)=>(y.sa+y.sb)-(x.sa+x.sb))[0],
lowCombined=h.games.filter(g=>g.sa+g.sb>0).sort((x,y)=>(x.sa+x.sb)-(y.sa+y.sb))[0],
highLoser=h.games.slice().sort((x,y)=>Math.min(y.sa,y.sb)-Math.min(x.sa,x.sb))[0],
lowWinner=h.games.filter(g=>Math.max(g.sa,g.sb)>0).sort((x,y)=>Math.max(x.sa,x.sb)-Math.max(y.sa,y.sb))[0];
function gd(g,mode='winner'){if(!g)return'—';let w=g.sa>=g.sb?g.a:g.b,l=g.sa>=g.sb?g.b:g.a,wu=g.s.um[g.s.rm[w.roster_id]?.owner_id],lu=g.s.um[g.s.rm[l.roster_id]?.owner_id],ws=Math.max(g.sa,g.sb),ls=Math.min(g.sa,g.sb);if(mode==='loser')return `${teamName(lu)} (@${username(lu)}) ${ls.toFixed(2)} lost to ${teamName(wu)} (@${username(wu)}) ${ws.toFixed(2)} (${g.season} W${g.week})`;return `${teamName(wu)} (@${username(wu)}) ${ws.toFixed(2)} over ${teamName(lu)} (@${username(lu)}) ${ls.toFixed(2)} (${g.season} W${g.week})`} (@${username(u)}) ${Math.max(g.sa,g.sb).toFixed(2)}–${Math.min(g.sa,g.sb).toFixed(2)} (${g.season} W${g.week})`}
let seasonTeams=[];for(const s of seasons)for(const r of s.rosters)seasonTeams.push({season:s.league.season,r,u:s.um[r.owner_id],pf:fp(r.settings),wins:r.settings?.wins||0,losses:r.settings?.losses||0});
let bestPF=seasonTeams.slice().sort((a,b)=>b.pf-a.pf)[0],bestWins=seasonTeams.slice().sort((a,b)=>b.wins-a.wins||b.pf-a.pf)[0];
let pSeason=h.playerPts.slice().sort((a,b)=>b.pts-a.pts)[0],pGame=h.playerPts.slice().sort((a,b)=>b.best-a.best)[0];
function st(x){return x?`${teamName(x.u)} (@${username(x.u)}) • ${x.pf.toFixed(1)} PF • ${x.season}`:'—'}
function pc(x,game=false){let p=pmap[x?.pid];return x&&p?`${p.name} • ${game?x.best.toFixed(1)+' pts ('+x.season+' W'+x.bestWeek+')':x.pts.toFixed(1)+' pts ('+x.season+')'}`:'—'}
let titleKing=h.fr.slice().sort((a,b)=>b.titles-a.titles||b.wins-a.wins)[0],winKing=h.fr.slice().sort((a,b)=>b.wins-a.wins)[0],pfKing=h.fr.slice().sort((a,b)=>b.pf-a.pf)[0];
let recs=[
['Highest team game',gd(hi)],['Biggest blowout',gd(blow)],['Closest decided game',gd(close)],
['Highest-scoring loss',gd(highLoser,'loser')],['Lowest-scoring win',gd(lowWinner)],['Highest combined game',`${gd(combined)} • ${(combined.sa+combined.sb).toFixed(2)} combined`],
['Lowest combined game',`${gd(lowCombined)} • ${(lowCombined.sa+lowCombined.sb).toFixed(2)} combined`],['Best season PF',st(bestPF)],
['Most wins in a season',bestWins?`${teamName(bestWins.u)} (@${username(bestWins.u)}) • ${bestWins.wins}-${bestWins.losses} • ${bestWins.season}`:'—'],
['Best player season',pc(pSeason)],['Best player game',pc(pGame,true)],
['Most championships',titleKing?`${titleKing.name} (@${titleKing.user}) • ${titleKing.titles}`:'—'],['Most all-time wins',winKing?`${winKing.name} (@${winKing.user}) • ${winKing.wins}`:'—'],['Most all-time PF',pfKing?`${pfKing.name} (@${pfKing.user}) • ${pfKing.pf.toFixed(1)}`:'—']
];
$('#records').innerHTML=`<article class="card"><h2>Record Book</h2><div class="meta">League, franchise and player records across every imported Sleeper season.</div><div class="recordgrid">${recs.map(r=>`<div class="recordcard"><div class="label">${esc(r[0])}</div><b>${esc(r[1])}</b></div>`).join('')}</div><div class="fine" style="margin-top:12px">Player records use weekly Sleeper scoring while the player was rostered in this league. Current-season games are included.</div></article>`;h.fr.sort((a,b)=>b.titles-a.titles||b.wins-a.wins||b.pf-a.pf);$('#franchises').innerHTML=`<article class="card"><h2>Franchise Hall</h2><div class="fine">Franchise history follows the Sleeper owner account. Team-name changes remain attached to the same franchise.</div><table><tr><th>Franchise / owner</th><th class="right">🏆</th><th class="right">W</th><th class="right">PF</th></tr>${h.fr.map(f=>`<tr><td><b>${esc(f.name)}</b><div class="owner">@${esc(f.user)}</div><div class="alias">Aliases: ${esc(aliasesFor(f.key,seasons).join(', '))}</div></td><td class="right">${f.titles}</td><td class="right">${f.wins}</td><td class="right">${f.pf.toFixed(1)}</td></tr>`).join('')}</table></article>`;
let career={};for(const x of h.playerPts){let p=career[x.pid]??={pid:x.pid,pts:0,best:0,bestSeason:null,bestGame:-999,bestWeek:null,seasons:0};p.pts+=x.pts;p.seasons++;if(x.pts>p.best){p.best=x.pts;p.bestSeason=x.season}if(x.best>p.bestGame){p.bestGame=x.best;p.bestWeek=`${x.season} W${x.bestWeek}`}}
let managerByPlayer={};for(const x of h.managerPlayer)(managerByPlayer[x.pid]??=[]).push(x);
let leaders=Object.values(career).filter(x=>pmap[x.pid]).sort((a,b)=>b.pts-a.pts).slice(0,75);
let palette=['#14c9a3','#149ed1','#f52c68','#d326e8','#f6a914','#86efac','#fb7185','#a78bfa','#38bdf8','#f97316','#84cc16','#e879f9'];
function journey(pid,total){let arr=(managerByPlayer[pid]||[]).sort((a,b)=>b.pts-a.pts),sum=arr.reduce((a,x)=>a+x.pts,0)||total||1;let bar=arr.map((x,i)=>`<div class="journeyseg" style="width:${Math.max(0,100*x.pts/sum)}%;background:${palette[i%palette.length]}" title="@${esc(x.user)} ${x.pts.toFixed(1)}"></div>`).join('');let leg=arr.map((x,i)=>`<span><i class="journeydot" style="background:${palette[i%palette.length]}"></i>@${esc(x.user)} ${x.pts.toFixed(1)} (${Math.round(100*x.pts/sum)}%)</span>`).join('');return `<div class="journey"><div class="journeybar">${bar}</div><div class="journeylegend">${leg}</div></div>`}
$('#players').innerHTML=`<article class="card"><h2>Player Encyclopedia</h2><div class="meta">Track each player's production in this league and identify which managers received those points.</div><details open><summary>What is the Manager Journey?</summary><div class="fine formula">The Manager Journey assigns each weekly point total to the Sleeper manager who owned the scoring roster that week. After a trade, subsequent production is credited to the new manager. Use the bar to see how a player's league production has been distributed across managers.</div></details>${leaders.map((x,i)=>{let p=pmap[x.pid],chg=p?.valueChange?.[FORMAT]?.days30||0,owners=managerByPlayer[x.pid]||[];return `<div class="playercard"><div class="playerhead"><div><div class="playername">${i+1}. ${esc(p.name)}</div><div class="fine">${esc(p.position)} • ${esc(p.team||'FA')} • age ${p.age??'—'} • best season ${x.bestSeason}: ${x.best.toFixed(1)} • best game ${x.bestGame.toFixed(1)} (${x.bestWeek})</div></div><div class="playerstats"><b>${x.pts.toFixed(1)}</b><div class="fine">league pts</div><b>${mv(p).toLocaleString()}</b><div class="fine ${chg>=0?'up':'down'}">30d ${chg>=0?'+':''}${chg}</div></div></div>${journey(x.pid,x.pts)}<div class="managerline">${owners.length} manager${owners.length===1?'':'s'} have received points from this player</div></div>`}).join('')}<div class="fine" style="margin-top:10px">Historical totals use Sleeper matchup scoring and therefore reflect this league's scoring settings.</div></article>`;

// Dynasty-Daddy-inspired league intelligence: value vs starters, positional concentration and trade-partner view.
let maxTotal=Math.max(...power.map(x=>x.total),1),maxStart=Math.max(...power.map(x=>x.starterValue),1);
let dots=power.map((x,i)=>{let left=8+84*x.total/maxTotal,bottom=10+76*x.starterValue/maxStart;return `<div class="mapdot" style="left:${left}%;bottom:${bottom}%">${i+1}</div><div class="maplabel" style="left:${left}%;bottom:${Math.min(92,bottom+7)}%">${esc(teamName(x.u))}</div>`}).join('');
let posNames=['QB','RB','WR','TE'];let posTables=posNames.map(pos=>{let sorted=power.map(x=>({x,v:x.pos[pos]||0})).sort((a,b)=>b.v-a.v);return `<div class="posbox"><b>${pos} capital</b>${sorted.slice(0,4).map((z,i)=>`<div class="capitalrow"><span class="capitalrank">${i+1}</span><span class="capitalteam">${esc(teamName(z.x.u))}</span><span class="capitalvalue">${z.v.toLocaleString()}</span></div>`).join('')}</div>`}).join('');
let posStats={};for(const p of posNames){let vals=power.map(x=>x.pos[p]||0),starts=power.map(x=>x.startPos[p]||0);posStats[p]={vals,starts}}
function rosterSignal(x,p){let totalPct=percentile(x.pos[p]||0,posStats[p].vals),startPct=percentile(x.startPos[p]||0,posStats[p].starts);return{p,totalPct,startPct,score:totalPct*.45+startPct*.55}}
let needs=power.map(x=>{let sig=posNames.map(p=>rosterSignal(x,p)),strengths=[...sig].sort((a,b)=>b.score-a.score),weak=[...sig].sort((a,b)=>a.score-b.score),need=weak.find(z=>z.startPct<35&&z.totalPct<45),surplus=strengths.find(z=>z.totalPct>=65&&z.startPct>=50)||strengths[0];return `<tr><td><b>${esc(teamName(x.u))}</b><div class="fine">@${esc(username(x.u))}</div></td><td><span class="needtag surplus">${surplus.p}</span><div class="compareline">${Math.round(surplus.score)} relative strength</div></td><td><span class="needtag ${need?'need':'balanced'}">${need?need.p:'No clear need'}</span><div class="compareline">${need?Math.round(need.score)+' relative strength':'No position is weak in both starter quality and total depth'}</div></td><td>${esc(x.arch)}</td></tr>`}).join('');
$('#insights').innerHTML=`<article class="card"><h2>League Intelligence</h2><div class="meta">Evaluate roster value, positional depth and potential trade fits across the league.</div><h3>Market Map</h3><div class="fine">Move right for greater total dynasty value. Move up for greater starting-lineup value. Teams in the upper-right combine strong current lineups with high total asset value.</div><div class="marketmap">${dots}<div class="axisx">TOTAL DYNASTY ASSETS →</div><div class="axisy">STARTER STRENGTH →</div></div></article><article class="card"><h2>Where the Capital Lives</h2><div class="posgrid">${posTables}</div></article><article class="card"><h2>Trade Partner Radar</h2><div class="meta">Use league-relative starter quality and total positional value to identify roster surpluses and actionable needs. A position is listed as a need only when both its starters and total depth rank below league thresholds.</div><table><tr><th>Manager</th><th>Strength</th><th>Need</th><th>Window</th></tr>${needs}</table></article>`;$('#seasons').innerHTML=seasons.slice().reverse().map(s=>`<article class="card"><h2>${esc(s.league.season)}</h2><div class="meta">${esc(s.league.name)} • ${s.rosters.length} teams • ${esc(s.league.status)}</div><div class="fine">League ID ${esc(s.league.league_id)}</div></article>`).join('');window.__seasons=seasons;$('#app').classList.remove('hidden')}
async function build(){try{$('#status').textContent='Finding every season in the Sleeper league chain…';let ls=await lineage(START_LEAGUE_ID);let ss=[];for(let i=0;i<ls.length;i++){$('#status').textContent=`Importing ${ls[i].season} (${i+1}/${ls.length})…`;ss.push(await seasonData(ls[i]))}$('#status').textContent='Loading dynasty market values…';let market=await marketData();$('#status').textContent='Valuing current rosters and future picks…';let power=await powerData(ss.at(-1),market);renderAll(ss,market,power);$('#status').innerHTML=`<span class="good">Done.</span> ${ss.length} seasons • ${market.players.length} dynasty-valued players • power rankings live.`}catch(e){console.error(e);$('#status').innerHTML=`<span class="error">Load failed:</span> ${esc(e.message)}. Refresh once; if it repeats, send a screenshot of this exact message.`}}
async function shareSeason(year){let s=window.__seasons.find(x=>x.league.season==year),u=s?.champ?s.um[s.champ.owner_id]:null,text=`🏆 ${year} DYNASTY CHAMPION\n${teamName(u)} : @${username(u)}\n${s.champ?.settings?.wins??'—'}–${s.champ?.settings?.losses??'—'} • ${fp(s.champ?.settings).toFixed(2)} PF`;if(navigator.share)await navigator.share({title:`${year} Dynasty Champion`,text,url:location.href});else{await navigator.clipboard.writeText(text+'\n'+location.href);alert('Copied!')}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['power','champions','records','franchises','players','insights','seasons'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==b.dataset.tab))});build();
</script></body></html>
