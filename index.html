<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0b1020'><title>Dynasty Hall of Fame</title><style>
:root{--bg:#080b12;--card:#111827;--card2:#172033;--text:#f8fafc;--muted:#94a3b8;--gold:#f4c542;--line:#263248;--green:#22c55e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b1020,#080b12 35%);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:20px 16px 80px}.eyebrow{color:var(--gold);font-weight:800;letter-spacing:.16em;font-size:12px}.hero h1{font-size:36px;line-height:1;margin:8px 0}.hero p{color:var(--muted);margin:0 0 18px}.panel,.card{background:rgba(17,24,39,.94);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 14px 40px #0004}.row{display:flex;gap:10px}.row>*{min-width:0}input{width:100%;background:#090e19;border:1px solid #334155;border-radius:12px;padding:13px;color:white;font-size:16px}button{border:0;border-radius:12px;padding:13px 15px;font-weight:800;background:var(--gold);color:#17120a;font-size:15px}button.secondary{background:#1f2937;color:#fff;border:1px solid #334155}.status{font-size:14px;color:var(--muted);margin-top:10px}.tabs{display:flex;gap:8px;overflow:auto;padding:6px 0 2px;position:sticky;top:0;background:#080b12ee;backdrop-filter:blur(10px);z-index:5}.tab{white-space:nowrap;background:#111827;color:#cbd5e1;border:1px solid var(--line);padding:9px 12px}.tab.active{background:var(--gold);color:#17120a}.hidden{display:none}.champ{border-left:4px solid var(--gold)}.champ .year{font-size:13px;color:var(--gold);font-weight:900}.champ h3{font-size:25px;margin:5px 0}.meta{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0b1220;border:1px solid #233047;border-radius:14px;padding:13px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid #243047}th{color:#94a3b8;font-size:12px}.right{text-align:right}.share{margin-top:12px;width:100%}.error{color:#fca5a5}.good{color:#86efac}@media(max-width:420px){.hero h1{font-size:32px}.row{flex-direction:column}.grid{grid-template-columns:1fr 1fr}}
</style></head><body><main class='wrap'><section class='hero'><div class='eyebrow'>SLEEPER DYNASTY</div><h1>Hall of Fame</h1><p>Your league history, championships and record book.</p></section>
<section class='panel'><div id='status' class='status'>Connecting to Sleeper and loading league history…</div></section>
<div id='app' class='hidden'><nav class='tabs'><button class='tab active' data-tab='champions'>Champions</button><button class='tab' data-tab='records'>Records</button><button class='tab' data-tab='franchises'>Franchises</button><button class='tab' data-tab='seasons'>Seasons</button></nav><section id='champions'></section><section id='records' class='hidden'></section><section id='franchises' class='hidden'></section><section id='seasons' class='hidden'></section></div>
</main><script>
const API='https://api.sleeper.app/v1'; const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function get(path){const r=await fetch(API+path);if(!r.ok)throw new Error(`${r.status} ${path}`);return r.json()}
function fp(s,k='fpts'){return Number(s?.[k]||0)+Number(s?.[k+'_decimal']||0)/100}
function teamName(user){return user?.metadata?.team_name||user?.display_name||user?.username||'Unknown Franchise'}
async function lineage(id){let out=[],seen=new Set();while(id&&id!=='0'&&!seen.has(id)){seen.add(id);let l=await get('/league/'+id);out.push(l);id=l.previous_league_id}return out.sort((a,b)=>+a.season-+b.season)}
async function seasonData(l){const [users,rosters,bracket]=await Promise.all([get(`/league/${l.league_id}/users`),get(`/league/${l.league_id}/rosters`),get(`/league/${l.league_id}/winners_bracket`).catch(()=>[])]);let weeks=[];for(let w=1;w<=18;w++){let m=await get(`/league/${l.league_id}/matchups/${w}`).catch(()=>[]);if(!m?.length)break;weeks.push({week:w,matchups:m})}const um=Object.fromEntries(users.map(u=>[u.user_id,u]));const rm=Object.fromEntries(rosters.map(r=>[r.roster_id,r]));let champMatch=[...bracket].filter(x=>x.p===1&&x.w).sort((a,b)=>b.r-a.r)[0];let champ=champMatch?rm[champMatch.w]:null;let runner=champMatch?rm[champMatch.l]:null;return {league:l,users,rosters,weeks,bracket,um,rm,champ,runner}}
function calc(seasons){let games=[],fr={};for(const s of seasons){for(const r of s.rosters){const u=s.um[r.owner_id],key=r.owner_id||`roster-${r.roster_id}`,f=fr[key]??={key,name:teamName(u),wins:0,losses:0,ties:0,pf:0,pa:0,titles:0,seasons:0};f.name=teamName(u);f.wins+=r.settings?.wins||0;f.losses+=r.settings?.losses||0;f.ties+=r.settings?.ties||0;f.pf+=fp(r.settings);f.pa+=fp(r.settings,'fpts_against');f.seasons++;if(s.champ?.roster_id===r.roster_id)f.titles++}for(const wk of s.weeks){let groups={};wk.matchups.forEach(m=>(groups[m.matchup_id]??=[]).push(m));Object.values(groups).forEach(g=>{if(g.length===2)games.push({season:s.league.season,week:wk.week,a:g[0],b:g[1],sa:g[0].points||0,sb:g[1].points||0,s})})}}return {games,fr:Object.values(fr)}}
function render(seasons){const {games,fr}=calc(seasons),completed=seasons.filter(s=>s.league.status==='complete'||s.champ);$('#champions').innerHTML=`<div class='grid'><div class='stat'><b>${completed.length}</b><span>completed seasons found</span></div><div class='stat'><b>${seasons[0]?.league.season}–${seasons.at(-1)?.league.season}</b><span>league history</span></div></div>`+completed.slice().reverse().map(s=>{let u=s.champ?s.um[s.champ.owner_id]:null,ru=s.runner?s.um[s.runner.owner_id]:null;return `<article class='card champ'><div class='year'>${esc(s.league.season)} CHAMPION</div><h3>${esc(teamName(u))}</h3><div class='meta'>${s.champ?.settings?.wins??'—'}–${s.champ?.settings?.losses??'—'} • ${fp(s.champ?.settings).toFixed(2)} PF${ru?` • defeated ${esc(teamName(ru))}`:''}</div><button class='secondary share' onclick='shareSeason(${JSON.stringify(s.league.season)})'>Share champion</button></article>`}).join('');
let hi=games.slice().sort((x,y)=>Math.max(y.sa,y.sb)-Math.max(x.sa,x.sb))[0], blow=games.slice().sort((x,y)=>Math.abs(y.sa-y.sb)-Math.abs(x.sa-x.sb))[0], close=games.filter(g=>g.sa!==g.sb).sort((x,y)=>Math.abs(x.sa-x.sb)-Math.abs(y.sa-y.sb))[0];function gd(g){if(!g)return '—';let win=g.sa>=g.sb?g.a:g.b,lose=g.sa>=g.sb?g.b:g.a;return `${teamName(g.s.um[g.s.rm[win.roster_id]?.owner_id])} ${Math.max(g.sa,g.sb).toFixed(2)}–${Math.min(g.sa,g.sb).toFixed(2)} (${g.season} W${g.week})`}
$('#records').innerHTML=`<article class='card'><h2>Record Book</h2><table><tr><th>Record</th><th>Holder</th></tr><tr><td>Highest team game</td><td>${esc(gd(hi))}</td></tr><tr><td>Biggest blowout</td><td>${esc(gd(blow))}</td></tr><tr><td>Closest decided game</td><td>${esc(gd(close))}</td></tr></table></article>`;
fr.sort((a,b)=>b.titles-a.titles||b.wins-a.wins||b.pf-a.pf);$('#franchises').innerHTML=`<article class='card'><h2>Franchise Hall</h2><table><tr><th>Franchise</th><th class='right'>🏆</th><th class='right'>W</th><th class='right'>PF</th></tr>${fr.map(f=>`<tr><td>${esc(f.name)}</td><td class='right'>${f.titles}</td><td class='right'>${f.wins}</td><td class='right'>${f.pf.toFixed(1)}</td></tr>`).join('')}</table></article>`;
$('#seasons').innerHTML=seasons.slice().reverse().map(s=>`<article class='card'><h2>${esc(s.league.season)}</h2><div class='meta'>${esc(s.league.name)} • ${s.rosters.length} teams • ${s.weeks.length} weeks imported • ${esc(s.league.status)}</div></article>`).join(''); window.__seasons=seasons;$('#app').classList.remove('hidden')}
async function build(){let id='1311827730211282944';$('#status').textContent='Finding historical seasons…';$('#status').className='status';try{let ls=await lineage(id);$('#status').textContent=`Found ${ls.length} seasons. Importing rosters, games and playoffs…`;let ss=[];for(let i=0;i<ls.length;i++){ $('#status').textContent=`Importing ${ls[i].season} (${i+1}/${ls.length})…`;ss.push(await seasonData(ls[i]))}render(ss);$('#status').innerHTML=`<span class='good'>Done.</span> Imported ${ss.length} seasons directly from Sleeper.`}catch(e){console.error(e);$('#status').innerHTML=`<span class='error'>Import failed:</span> ${esc(e.message)}. If Safari blocks the API when opened as a local file, deploy this page to any HTTPS host (GitHub Pages, Netlify or Vercel).`}}
async function shareSeason(year){let s=window.__seasons.find(x=>x.league.season==year),u=s?.champ?s.um[s.champ.owner_id]:null,text=`🏆 ${year} DYNASTY CHAMPION\n${teamName(u)}\n${s.champ?.settings?.wins??'—'}–${s.champ?.settings?.losses??'—'} • ${fp(s.champ?.settings).toFixed(2)} PF\nDynasty Hall of Fame`;if(navigator.share)await navigator.share({title:`${year} Dynasty Champion`,text});else{await navigator.clipboard.writeText(text);alert('Champion card text copied!')}}
$('#load').addEventListener('click',build);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['champions','records','franchises','seasons'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==b.dataset.tab))});
</script></body></html>
